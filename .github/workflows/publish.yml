name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      pack: true

  release:
    needs: verify
    if: github.repository == 'SaqifHoque/vue-dicom-canvas' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      tarball: ${{ steps.release.outputs.tarball }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
      - name: Check the release against npm
        id: release
        shell: bash
        run: |
          tarballs=(vue-dicom-canvas-*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "Expected exactly one package tarball" >&2
            exit 1
          fi
          tarball="./${tarballs[0]}"
          printf 'tarball=%s\n' "$tarball" >> "$GITHUB_OUTPUT"
          tar -xOf "$tarball" package/package.json | node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const { name, version } = JSON.parse(readFileSync(0, "utf8"));
            const stable = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
            if (name !== "vue-dicom-canvas" || !stable.test(version)) {
              throw new Error("Unexpected package name or version");
            }
            const response = await fetch("https://registry.npmjs.org/" + name, {
              signal: AbortSignal.timeout(30000),
            });
            const setMode = mode => appendFileSync(process.env.GITHUB_OUTPUT, "mode=" + mode + "\n");
            if (response.status === 404) {
              if (version !== "2.0.2") throw new Error("Only version 2.0.2 can bootstrap this package");
              setMode("bootstrap");
              process.exit(0);
            }
            if (!response.ok) throw new Error("Registry check failed with " + response.status);
            const metadata = await response.json();
            const latest = metadata["dist-tags"]?.latest;
            if (!metadata.versions || !stable.test(latest)) throw new Error("Invalid registry metadata");
            if (Object.hasOwn(metadata.versions, version)) {
              console.log(name + "@" + version + " is already published");
              setMode("skip");
              process.exit(0);
            }
            const previous = latest.split(".").map(Number);
            const difference = version.split(".").map((part, i) => Number(part) - previous[i]).find(Boolean);
            if (!(difference > 0)) throw new Error("The release version must be newer than latest");
            setMode("trusted");
          '

  bootstrap:
    needs: release
    if: needs.release.outputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
      - name: Publish the first unscoped release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          PACKAGE_TARBALL: ${{ needs.release.outputs.tarball }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Set NPM_BOOTSTRAP_TOKEN in the npm environment for the first unscoped release"
            exit 1
          fi
          npm publish "$PACKAGE_TARBALL" --ignore-scripts --access public --provenance

  publish:
    needs: release
    if: needs.release.outputs.mode == 'trusted'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
      - name: Publish with npm Trusted Publishing
        env:
          PACKAGE_TARBALL: ${{ needs.release.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --ignore-scripts --access public
