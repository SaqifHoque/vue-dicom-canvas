name: CI

on:
    pull_request:
    workflow_call:
        inputs:
            pack:
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: npm ci
            - run: npm audit --audit-level=high
            - run: npm run check
            - run: npm run build:example
            - run: npm run verify:package
            - name: Pack verified library
              if: inputs.pack
              run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: inputs.pack
              with:
                  name: npm-package
                  path: ${{ runner.temp }}/vue-dicom-canvas-*.tgz
                  if-no-files-found: error
                  retention-days: 1

    consumers:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            matrix:
                directory: [docs-site, examples/minimal]
        defaults:
            run:
                working-directory: ${{ matrix.directory }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: npm ci
            - run: npm audit --audit-level=high
            - run: npm run build

    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - run: npm run test:browser
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              if: failure()
              with:
                  name: browser-failure-artifacts
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
